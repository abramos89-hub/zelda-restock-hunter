
name: Zelda Restock Hunter

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: zelda-restock-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore alert state
        uses: actions/cache@v4
        with:
          path: state.json
          key: zelda-state-${{ github.run_id }}
          restore-keys: |
            zelda-state-

      - name: Install dependencies
        run: pip install -r requirements.txt

        - name: Test Telegram delivery
       env:
         TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
         TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
       run: |
         python - <<'PY'
         import os
         import json
         import urllib.request
         import urllib.parse
         token = os.environ["TELEGRAM_BOT_TOKEN"]
         chat_id = os.environ["TELEGRAM_CHAT_ID"]
         data = urllib.parse.urlencode({
             "chat_id": chat_id,
             "text": "Zelda Restock Hunter: Telegram test successful!"
         }).encode()
         url = f"https://api.telegram.org/bot{token}/sendMessage"
         req = urllib.request.Request(url, data=data)
         with urllib.request.urlopen(req, timeout=20) as response:
             print(response.read().decode())
         PY

      - name: Check pages and send Telegram alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py
